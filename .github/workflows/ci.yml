name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check marketplace and plugin manifests agree
        run: python3 scripts/check-manifests.py

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            echo "::group::${dir}"
            claude plugin validate "${dir}"
            echo "::endgroup::"
          done

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find plugins -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Run the crap-score tests
        working-directory: plugins/trobanga-skills/skills/engineering/crap-score/scripts
        run: python3 -m pytest -q
