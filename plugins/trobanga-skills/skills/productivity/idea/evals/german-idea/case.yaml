schema_version: "1.1"
name: german-idea
description: >
  The user describes the idea in German, with a confirmed problem and every
  detail, while the instructions around it are English. The skill writes the
  file in the user's language with translated headings, and as an inverted
  pyramid whose top lines are the problem and the idea. Hypothesis: a default
  agent answers in a free-form layout, or keeps English headings because the
  surrounding instructions are English. The heading graders check the skill's
  own template, so they show that it is passed on, not that it is better.
  idea is user-invoked: run it on a copy made by evaluate-skill's
  `skill_eval.py prepare`. Run with --allow-tools Write.
tags: [language]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Use the idea skill. Everything is settled, so write it up without
    further questions.

    Problem (ich bestätige diesen Satz): Unsere Support-Mitarbeiter
    beantworten jede Woche rund 300 Tickets zur Frage "Wo ist meine
    Bestellung?", jedes kostet im Schnitt sechs Minuten.

    Idee: Eine Sendungsverfolgungsseite, auf die jede Versandbestätigung
    verlinkt und die den Status direkt beim Paketdienst abfragt.

    Betroffen sind die zwölf Leute im Support, also etwa 30 Stunden pro
    Woche. Aufwand: zwei Wochen für die Seite und die Anbindung an DHL und
    DPD. Offene Frage: Was zeigen wir bei Sendungen ohne Tracking-Nummer?
graders:
  - name: file-written
    type: file_exists
    path: 'ideas/*.md'
  - name: problem-and-idea-on-top
    type: tool_used
    tool: Write
    input_match: '"content"\s*:\s*"# (?:(?!\\n).)+(?:\\n)+\*\*Problem:\*\*(?:(?!\\n).)+(?:\\n)+\*\*Idee:\*\*'
  - name: german-headings
    type: tool_used
    tool: Write
    input_match: '## Inhalt[\s\S]*## Problem[\s\S]*## Idee[\s\S]*## Details'
  - name: no-english-headings
    type: tool_used
    tool: Write
    input_match: '## (Contents|Idea|Open questions)\b'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
