schema_version: "1.1"
name: solution-first
description: >
  The user states a solution ("put a Redis cache in front of the API") and no
  problem. The skill's rule is that every idea solves a problem, found by
  interviewing one question at a time with a recommended answer, before any
  file is written. Hypothesis: a default agent writes the idea file at once,
  inventing the problem, or fires a list of questions. idea is user-invoked:
  run it on a copy made by evaluate-skill's `skill_eval.py prepare`. Run with
  --allow-tools Write, so that writing the file early is possible.
tags: [interview]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Use the idea skill. My idea: we should put a Redis cache in front of the
    product API.
graders:
  - name: no-file-yet
    type: file_exists
    path: 'ideas/*.md'
    exists: false
    arm: both
  - name: one-question
    type: llm
    criteria: >
      PASS if the final message puts exactly one question to the user
      (one thing to answer; a question with a short clarifying clause
      counts as one). FAIL if it asks two or more separate questions, or
      none.
  - name: asks-for-problem
    type: llm
    criteria: >
      PASS if the question asks about the problem behind the idea (for
      example who suffers, what symptom, how slow, how often, what it
      costs) rather than about how to build the cache (eviction policy,
      TTL, cluster size, which client library). FAIL otherwise.
  - name: recommends-answer
    type: llm
    criteria: >
      PASS if, together with the question, the message offers the agent's
      own recommended or most likely answer for the user to confirm or
      correct. FAIL if it only asks.
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
