schema_version: "1.1"
name: group-by-label
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  prompt: |
    Use the release-notes skill. Write release notes for this repository.
graders:
  - name: written
    type: file_exists
    path: RELEASE_NOTES.md
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
