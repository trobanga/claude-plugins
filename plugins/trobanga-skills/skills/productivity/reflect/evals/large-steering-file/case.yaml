schema_version: "1.1"
name: large-steering-file
description: >
  The project's CLAUDE.md has 212 lines: a few true pointers, many no-ops,
  and the rule "use decimal.Decimal for amounts" repeated 24 times. In the
  session, the agent still uses float64 for an amount and the user corrects
  it. The skill sees that the file is past the 200-line limit and proposes
  running reflect with `audit` on it, rather than adding the rule a 25th
  time. Hypothesis: a default agent adds or strengthens the decimal rule in
  CLAUDE.md and does not see that the length of the file buries it. reflect
  is user-invoked: run it on a copy made by evaluate-skill's `skill_eval.py
  prepare`. Run with --allow-tools Write,Edit so that a write is visible.
tags: [pruning, size]
context:
  add_dirs: [billing]
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Use the reflect skill. The project is the `billing` folder, one of your
    additional working directories. The session to review:

    USER: Add a late fee of 2.5 % to overdue invoices in
    internal/dunning/fees.go.

    ASSISTANT: Added `func LateFee(amount float64) float64 { return amount
    * 0.025 }` and a test. `make test` passes.

    USER: Amounts are never float64 here, it's in CLAUDE.md. Use
    decimal.Decimal.

    ASSISTANT: Changed it to `func LateFee(amount decimal.Decimal)
    decimal.Decimal` with `decimal.NewFromFloat(0.025)`; the test passes.
graders:
  - name: audit-for-size
    type: llm
    criteria: >
      PASS if the answer points out that CLAUDE.md is longer than 200 lines
      (or names its length, about 212 lines, as a problem) and proposes
      running reflect's audit on it or pruning it.
  - name: no-25th-rule
    type: llm
    criteria: >
      PASS if the answer does not propose adding another line about
      decimal.Decimal to CLAUDE.md. Proposing a check (for example a
      golangci-lint `forbidigo` rule) or deleting the repeats passes.
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
