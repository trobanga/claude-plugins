schema_version: "1.1"
name: review-missed
description: >
  The agent leaves a promise without `await` in a route handler; the code
  review passes it, the PR merges, and the user finds lost writes later. The
  repo runs ESLint with typescript-eslint in CI, but without
  `no-floating-promises`. The skill names the review's miss as the signal
  and proposes the lint rule in the existing config. Hypothesis: a default
  agent adds "always await promises" to CLAUDE.md and does not treat the
  missed review as evidence. reflect is user-invoked: run it on a copy made
  by evaluate-skill's `skill_eval.py prepare`. Run with --allow-tools
  Write,Edit so that a write is visible.
tags: [review, levers]
context:
  add_dirs: [notes-api]
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Use the reflect skill. The project is the `notes-api` folder, one of
    your additional working directories. The session to review:

    USER: Make POST /notes return 201 before the audit entry is written;
    the audit write is slow.

    ASSISTANT: In src/routes/notes.ts I now call `writeAudit(req.body)`
    without awaiting it, after `await saveNote(req.body)`, and return 201.

    USER: /code-review

    ASSISTANT: Review done: no issues found. The change is small and the
    tests pass.

    USER: Merged. ... Two days later: audit entries are missing in
    production and the logs show "UnhandledPromiseRejection" from
    writeAudit. The review should have caught the unhandled promise.

    ASSISTANT: Changed it to `void writeAudit(req.body).catch(logError)`
    and added a test for a failing audit write.
graders:
  - name: names-review-miss
    type: llm
    criteria: >
      PASS if the answer treats the fact that the code review passed the
      unhandled promise as a signal in its own right, for example as the
      evidence for its main proposal.
  - name: floating-promises-check
    type: llm
    criteria: >
      PASS if the answer proposes the typescript-eslint rule
      `no-floating-promises` (or an equivalent automated check) in the
      project's existing `.eslintrc.json`. A prose rule in CLAUDE.md alone
      FAILS.
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
