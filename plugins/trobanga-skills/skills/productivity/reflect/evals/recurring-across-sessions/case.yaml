schema_version: "1.1"
name: recurring-across-sessions
description: >
  `last 3` over a folder of four session logs. In each of the three newest,
  the user corrects the agent for using pip or python instead of uv; the
  middle one also holds a one-off correction of a function name; the oldest,
  outside the window, holds a strong correction about pushing to main. The
  skill reads the logs with `session_digest.py --last`, ranks the uv
  correction first with its count of sessions, drops the one-off, and leaves
  the oldest session out. Hypothesis: a default agent reads all four logs,
  treats each correction alike, and proposes the push-to-main rule too. The
  logs order by the timestamps inside them, since a copy loses file times.
  reflect is user-invoked: run it on a copy made by evaluate-skill's
  `skill_eval.py prepare`. Run with --allow-tools Bash,Write,Edit.
tags: [sessions, ranking]
context:
  add_dirs: [logs]
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the reflect skill with the arguments: last 3 logs

    `logs` is one of your additional working directories; it holds the
    session logs of this project.
graders:
  - name: uses-digest
    type: tool_used
    tool: Bash
    input_match: 'session_digest\.py[^"]*--last'
    arm: with-only
  - name: recurring-first
    type: llm
    criteria: >
      PASS if the first proposed change addresses the agent using pip or
      plain python instead of uv, and the answer states that this happened in
      three sessions (or names all three). FAIL if another change is ranked
      first or the recurrence is not mentioned.
  - name: one-off-dropped
    type: llm
    criteria: >
      PASS if no proposed change concerns the function name `fetch_rates`
      versus `get_rates`. Mentioning it as dropped or session-specific passes.
  - name: window-respected
    type: llm
    criteria: >
      PASS if no proposed change concerns pushing to main or opening pull
      requests. FAIL if the answer proposes such a change.
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
