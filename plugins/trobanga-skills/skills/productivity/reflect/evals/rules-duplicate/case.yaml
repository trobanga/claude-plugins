schema_version: "1.1"
name: rules-duplicate
description: >
  The project keeps its API rule in a path-scoped file,
  `.claude/rules/api.md`: validate every request body with zod. In the
  session the agent did not, and the user corrected it. The skill reads
  `.claude/rules/`, finds that the rule already exists, and does not propose
  it again. Hypothesis: a default agent reads only CLAUDE.md and proposes
  the zod rule as a new line there. reflect is user-invoked: run it on a
  copy made by evaluate-skill's `skill_eval.py prepare`. Run with
  --allow-tools Write,Edit so that a write is visible.
tags: [rules, duplicates]
context:
  add_dirs: [shop]
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Use the reflect skill. The project is the `shop` folder, one of your
    additional working directories. The session to review:

    USER: Add POST /users in src/api/users.ts.

    ASSISTANT: Added the route; it reads `req.body.email` and
    `req.body.name` and answers 201.

    USER: You skipped the validation. Every body goes through its zod
    schema, see src/api/schemas.ts.

    ASSISTANT: Now it calls `newUser.safeParse(req.body)` and answers 400
    with the issues on failure.
graders:
  - name: reads-rules
    type: tool_used
    tool: Read
    input_match: '\.claude/rules/api\.md'
  - name: no-duplicate
    type: llm
    criteria: >
      PASS if the answer proposes no new line about zod or request-body
      validation in any CLAUDE.md, rules file or memory file. Noting that
      `.claude/rules/api.md` already holds the rule passes, and so does
      proposing a check (a test or lint rule) instead of text.
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
