schema_version: "1.1"
name: prior-knowledge
description: >
  The user states prior knowledge ("I already know pattern matching and the
  pipe operator, two years of Phoenix"). The skill records stated prior
  knowledge, with its depth, as the next learning record (0003, after the
  existing 0001 and 0002). Hypothesis: a default agent acknowledges it in
  chat and records nothing, or starts a new numbering. teach is
  user-invoked: run it on a copy made by evaluate-skill's `skill_eval.py
  prepare`. The workspace is built by scaffold.sh: run with --scaffold
  --allow-tools Write Edit.
tags: [learning-records]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Use the teach skill. Before you plan the next lesson: I already know
    pattern matching and the pipe operator well; I have shipped two Phoenix
    apps over the last two years. Don't teach me those.
graders:
  - name: record-written
    type: file_exists
    path: 'learning-records/0003-*.md'
  - name: numbering-kept
    type: tool_used
    tool: Write
    input_match: 'learning-records/000[012]-'
    min: 0
    max: 0
    arm: both
  - name: depth-recorded
    type: tool_used
    tool: Write
    input_match: 'learning-records/0003-[\s\S]*(?:two years|2 years|Phoenix)'
  - name: not-retaught
    type: tool_used
    tool: Write
    input_match: 'lessons/0002-[a-z0-9-]*(?:pattern|pipe|match)'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
