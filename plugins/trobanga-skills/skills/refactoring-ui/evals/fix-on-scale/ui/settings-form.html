<!-- Tailwind CSS v3 is loaded by the app shell. -->
<form class="bg-white p-[20px] w-full">
  <h1 class="text-[26px] font-bold text-black mb-[12px]">Account settings</h1>
  <p class="text-gray-400 text-[15px] mb-[12px]">
    Changes to your profile are visible to everyone in your organisation, including guests who were invited to a single project, so check them before you save.
  </p>

  <h2 class="text-[19px] font-bold text-black mb-[12px]">Profile</h2>
  <label class="block text-[17px] font-bold text-black mb-[12px]">Display name</label>
  <input class="border border-gray-300 p-[7px] w-full mb-[12px]" value="Ana Souza">
  <label class="block text-[17px] font-bold text-black mb-[12px]">Job title</label>
  <input class="border border-gray-300 p-[7px] w-full mb-[12px]" value="Engineering manager">

  <h2 class="text-[19px] font-bold text-black mb-[12px]">Notifications</h2>
  <label class="block text-[17px] font-bold text-black mb-[12px]">Email digest</label>
  <select class="border border-gray-300 p-[7px] w-full mb-[12px]">
    <option>Daily</option>
    <option>Weekly</option>
  </select>
  <p class="text-gray-400 text-[13px] mb-[12px]">We send the digest at 08:00 in your time zone.</p>

  <button class="bg-blue-600 text-white px-[14px] py-[7px] mt-[12px]">Save</button>
  <button class="bg-blue-600 text-white px-[14px] py-[7px] mt-[12px]">Cancel</button>
</form>
