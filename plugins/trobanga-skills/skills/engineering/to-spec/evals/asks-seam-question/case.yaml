schema_version: "1.1"
name: asks-seam-question
description: >
  A settled feature conversation (overdue-invoice reminders) that never
  discussed how to test it, in a repo whose existing seam is InvoiceService
  with tests through it. Targets the default failures of writing and
  publishing the spec at once, of interviewing the user about requirements
  the conversation already settled, and of proposing new low seams (the
  mailer, a scheduler, the PDF renderer). The skill (step 2) must propose
  the existing InvoiceService seam and ask the user to confirm it before
  publishing. The skill sets disable-model-invocation, so run it through
  evaluate-skill's prepare step; run with --scaffold --allow-tools Bash.
tags: [seams]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, AskUserQuestion]
  prompt: |
    Our discussion so far:

    > me: customers forget to pay. I want billing to send reminder emails
    > for overdue invoices.
    > you: when should the first one go out?
    > me: 7 days after the due date, then every 7 days, at most 3 in total.
    > you: and once they pay?
    > me: stop immediately. Also a customer can opt out of reminders, but
    > the invoice itself still counts as overdue.
    > you: understood, that covers it.

    Use the to-spec skill.
graders:
  - name: proposes-existing-seam
    type: llm
    criteria: >
      PASS if the final message proposes testing the feature through the
      existing InvoiceService public interface (as the existing tests do),
      as the single or main seam, rather than through the mailer, the PDF
      renderer, a scheduler or other internals. FAIL otherwise.
  - name: asks-to-confirm-seams
    type: llm
    criteria: >
      PASS if the final message (or a question the agent asked) asks the
      user to confirm the proposed test seams before the spec is written
      or published. FAIL if it publishes or presents a finished spec
      without that confirmation.
  - name: no-interview
    type: llm
    criteria: >
      PASS if the agent asks no questions about requirements the
      conversation already settled (timing, the limit of 3, stopping on
      payment, opt-out). A seam question is allowed. FAIL otherwise.
  - name: not-published
    type: tool_used
    tool: Bash
    input_match: 'gh\s+issue\s+create'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?to-spec"'
    arm: with-only
