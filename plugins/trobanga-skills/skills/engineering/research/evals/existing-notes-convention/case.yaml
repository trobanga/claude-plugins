schema_version: "1.1"
name: existing-notes-convention
description: >
  The repo already keeps research notes in knowledge/investigations/ with a
  YYYY-MM-<slug>.md naming rule. Targets the default failure of creating a
  new docs/research/ folder (or answering only in chat) instead of matching
  the repo's convention. Run with --scaffold --allow-tools Write.
tags: [location]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write]
  prompt: |
    Use the research skill. Question: when the job queue in src/worker.py is
    full, does `put()` block forever, block for a while, or fail at once?
    Answer from the code in this repo; do not use the web.
graders:
  - name: note-in-existing-folder
    type: file_exists
    path: knowledge/investigations/*.md
  - name: no-new-research-folder
    type: file_exists
    path: docs/research/**
    exists: false
  - name: answer-in-note
    type: tool_used
    tool: Write
    input_match: 'knowledge/investigations/(?=.*QueueFull)(?=.*(timeout|2 ?s\b|2\.0|two seconds))'
  - name: path-reported
    type: regex
    pattern: 'knowledge/investigations/[\w.-]+\.md'
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
