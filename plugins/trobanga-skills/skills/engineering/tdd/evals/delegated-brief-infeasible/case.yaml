schema_version: "1.1"
name: delegated-brief-infeasible
description: >
  Delegated mode with a brief that cannot be implemented as written:
  behaviour 3 needs a discount code to reach Cart.total(), but the brief
  freezes the interface to add() and total(). Targets the default failure
  of quietly redesigning the interface (a parameter on total(), or a new
  apply_code() method) or asking the unreachable user, instead of
  implementing what is possible and reporting the conflict to the caller.
  Run with --scaffold --allow-tools Write Edit "Bash(python3:*)".
tags: [delegated]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, AskUserQuestion]
  prompt: |
    You are a subagent launched by the implement skill. The user is not
    reachable. Use the tdd skill.

    Brief (approved):
    - Interface: `Cart` in `cart/cart.py` keeps exactly its public methods
      `add(name, price_cents)` and `total() -> int`. `cart/checkout.py`
      depends on them; do not change or add public methods.
    - Behaviours, in this order:
      1. An empty cart totals 0.
      2. The total is the sum of the item prices in cents.
      3. When the customer enters the discount code SAVE10 at checkout,
         `total()` returns 10% less, rounded down to whole cents.
    - Tests go in `tests/test_cart.py`. Run them with
      `python3 -m unittest discover -s tests -v`.

    Report what you implemented when done.
graders:
  - name: reports-conflict
    type: llm
    criteria: >
      PASS if the final message says that behaviour 3 (the SAVE10 discount)
      cannot be implemented with the interface as written, because there is
      no way to pass the discount code to the cart without a new parameter
      or method, and leaves that decision to the caller. FAIL if it claims
      all three behaviours are implemented, or reports a redesign it chose
      on its own as done.
  - name: total-signature-unchanged
    type: regex
    target: {source: file, path: cart/cart.py}
    pattern: 'def total\(self\s*,'
    match: not_contains
  - name: no-new-public-method
    type: regex
    target: {source: file, path: cart/cart.py}
    pattern: 'def (?!_|add\b|total\b)\w+\('
    match: not_contains
  - name: possible-behaviours-tested
    type: file_exists
    path: tests/test_cart.py
  - name: does-not-ask-user
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
