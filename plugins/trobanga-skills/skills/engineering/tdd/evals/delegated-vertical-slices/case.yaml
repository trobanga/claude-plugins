schema_version: "1.1"
name: delegated-vertical-slices
description: >
  Delegated mode with an approved brief. Targets two default failures:
  horizontal slicing (all tests written first, then all code, so the test
  command runs only two or three times) and mocking an own, in-process
  collaborator (EmailValidator) instead of only the SMTP boundary. Also
  checks that a delegated agent does not stop to ask for confirmation.
  Run with --scaffold --allow-tools Write Edit "Bash(python3:*)".
tags: [delegated, vertical-slice, mocking]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, AskUserQuestion]
  prompt: |
    You are a subagent launched by the implement skill. The user is not
    reachable. Use the tdd skill.

    Brief (approved):
    - Interface: `Registration(mailer, validator=None).register(email) -> Result`
      in `registration/service.py`. Do not change it.
    - Behaviours, in this order:
      1. A valid address returns `Result(registered=True)` and sends one
         welcome mail to that address.
      2. An invalid address returns `Result(registered=False, reason="invalid email")`
         and sends no mail.
      3. Registering the same address twice returns
         `Result(registered=False, reason="already registered")` the second time.
    - Tests go in `tests/test_registration.py`. Run them with
      `python3 -m unittest discover -s tests -v`.

    Report what you implemented when done.
graders:
  - name: red-green-per-behaviour
    type: tool_used
    tool: Bash
    input_match: 'unittest'
    min: 5
  - name: suite-green
    type: regex
    target: trace
    pattern: 'Ran [3-9] tests in [^"]{0,40}OK'
  - name: no-mock-of-own-validator
    type: regex
    target: {source: file, path: tests/test_registration.py}
    pattern: '(patch|Mock|mock)[^\n]*(EmailValidator|validator|is_valid)'
    flags: i
    match: not_contains
  - name: no-real-smtp
    type: regex
    target: {source: file, path: tests/test_registration.py}
    pattern: 'SmtpMailer\('
    match: not_contains
  - name: no-confirmation-question
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
