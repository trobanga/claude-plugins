schema_version: "1.1"
name: config-required-label
description: >
  The project config records a deviation: every issue needs exactly one
  `area:` label. Targets the default failure of filing a bare `gh issue
  create` without reading .agents/issue-tracker.md, so triage closes the
  issue. The skill resolves the tracker through resolve-config.md, which
  reads that file; the command must carry `area:checkout` (the bug is in
  coupons at checkout) and no other area label. The run cannot reach GitHub,
  so the prompt asks for the filing command in file-issue.sh.
  Run with --scaffold --allow-tools Bash Write.
tags: [resolve, deviation]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, AskUserQuestion]
  prompt: |
    Coupon codes are ignored at checkout: `apply_coupon` returns the total
    unchanged, so SPRING10 gives no discount, though the confirmation page
    says it was applied. Use the file-issue skill to file it. This sandbox
    cannot reach GitHub: do everything up to the filing command, then write
    that exact shell command, with the full issue text, to `file-issue.sh`
    instead of running it.
graders:
  - name: command-written
    type: file_exists
    path: file-issue.sh
  - name: required-area-label
    type: regex
    pattern: 'area:checkout'
    target: {source: file, path: file-issue.sh}
  - name: one-area-label
    type: regex
    pattern: 'area:(catalog|accounts)'
    match: not_contains
    target: {source: file, path: file-issue.sh}
  - name: github-repo
    type: regex
    pattern: 'gh\s+issue\s+create'
    target: {source: file, path: file-issue.sh}
  - name: no-approval-question
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?file-issue"'
    arm: with-only
