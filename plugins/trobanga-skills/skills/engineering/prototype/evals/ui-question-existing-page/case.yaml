schema_version: "1.1"
name: ui-question-existing-page
description: >
  A "what should this look like" question about an existing Next.js page.
  Targets the default failures of producing one redesign (or a static
  mock-up) instead of several switchable variants, of putting them on a new
  throwaway route instead of the existing /settings route, and of a
  switcher bar that would ship to production. Nothing is installed or run;
  the case grades the written files. Run with --scaffold --allow-tools
  Write Edit.
tags: [ui]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Use the prototype skill. Our settings page (app/settings/page.tsx) is a
    cluttered wall of inputs. What should it look like? I want to see
    options before we commit.
graders:
  - name: on-existing-route
    type: regex
    target: trace
    pattern: '"name":"(Edit|Write)"[^\n]{0,300}app/settings/page\.tsx'
  - name: variant-param
    type: regex
    target: trace
    pattern: 'get\(\\?[''"]variant\\?[''"]\)|\?variant='
  - name: three-variants
    type: regex
    target: trace
    pattern: 'Variant ?C|variant[ _-]?c\b'
    flags: i
  - name: switcher-gated
    type: regex
    target: trace
    pattern: 'NODE_ENV'
  - name: no-new-top-level-route
    type: file_exists
    path: 'app/prototype/**'
    exists: false
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
