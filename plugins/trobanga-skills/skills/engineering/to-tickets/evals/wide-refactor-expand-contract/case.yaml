schema_version: "1.1"
name: wide-refactor-expand-contract
description: >
  A rename whose blast radius covers 14 packages and about 300 call sites
  (`customer_ref` / CustomerRef to `account_id` / AccountId), with CI that
  must stay green. Targets the default failures of one giant rename ticket
  and of forcing it into vertical slices that cannot land green. The skill
  must sequence it expand-contract: an expand ticket adds the new form
  beside the old, migrate batches per package or group each blocked by the
  expand, and a contract ticket blocked by every batch. Graded on the
  proposed breakdown, before approval. The skill sets
  disable-model-invocation, so run it through evaluate-skill's prepare
  step; run with --scaffold --allow-tools Bash Write.
tags: [wide-refactor]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, AskUserQuestion]
  prompt: |
    Spec: rename `customer_ref` to `account_id` everywhere: the database
    column, the `CustomerRef` type (it becomes `AccountId`), and every call
    site in all packages. CI must stay green on main the whole time; several
    teams merge into these packages every day.

    Use the to-tickets skill to break this into tickets.
graders:
  - name: expand-first
    type: llm
    criteria: >
      PASS if the first ticket of the proposed breakdown adds the new form
      (the account_id column and the AccountId type) beside the old one
      without removing customer_ref or CustomerRef. FAIL otherwise.
  - name: batched-migration
    type: llm
    criteria: >
      PASS if the call-site migration is split into several tickets by
      package or group of packages, each blocked by the expand ticket and
      not by each other. FAIL if the migration is one ticket, or the
      batches are chained one after another.
  - name: contract-last
    type: llm
    criteria: >
      PASS if a final ticket deletes the old column and the old type, and
      is blocked by every migration batch. FAIL otherwise.
  - name: nothing-written-before-approval
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?to-tickets"'
    arm: with-only
