schema_version: "1.1"
name: quiz-before-publish
description: >
  A short spec for bulk price tiers in a repo where pricing is computed
  inline twice (a prefactoring opportunity). Targets the default failures
  of writing the tickets straight away without the user's approval, and of
  slicing horizontally (schema, then API, then UI). The skill must present
  a numbered breakdown with title, blockers and delivered behaviour per
  ticket, prefactoring first, ask about granularity and blocking edges, and
  write nothing before approval. The skill sets disable-model-invocation, so
  run it through evaluate-skill's prepare step; run with --scaffold
  --allow-tools Bash Write.
tags: [quiz, vertical]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, AskUserQuestion]
  prompt: |
    Spec: bulk price tiers.

    - A product can have price tiers: from a minimum quantity upward, a
      lower unit price applies (for example 1-9 at 5.00, 10+ at 4.50).
    - The cart total uses the tier that matches each line's quantity.
    - The cart page shows the applied unit price per line, and a hint
      "buy N more to pay X each" when the next tier is close (within 3).
    - Admins set tiers through the existing product API.

    Use the to-tickets skill to break this into tickets.
graders:
  - name: nothing-written-before-approval
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: breakdown-shape
    type: llm
    criteria: >
      PASS if the final message presents a numbered list of tickets where
      each ticket has a title, the tickets that block it (or none), and the
      end-to-end behaviour it delivers. FAIL otherwise.
  - name: asks-for-approval
    type: llm
    criteria: >
      PASS if the final message asks the user whether the granularity is
      right and whether the blocking edges are correct (or to approve,
      merge or split tickets) before publishing. FAIL if it reports the
      tickets as already published or written.
  - name: vertical-not-layers
    type: llm
    criteria: >
      PASS if the tickets are vertical slices, each delivering a working
      behaviour across the layers it needs, and none is a single layer such
      as "add the schema", "add the API" or "build the UI" on its own; a
      prefactoring ticket that unifies the duplicated pricing logic is
      allowed and comes first. FAIL otherwise.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?to-tickets"'
    arm: with-only
