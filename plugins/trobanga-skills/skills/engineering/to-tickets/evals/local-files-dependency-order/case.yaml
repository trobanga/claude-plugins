schema_version: "1.1"
name: local-files-dependency-order
description: >
  The user has already approved a four-ticket breakdown, listed out of
  dependency order. Tracker none: tickets are local files. Targets the
  default failures of writing one combined tickets file, numbering tickets
  in the order the user listed them, and dropping the blocking edges. The
  skill must write .agents/issues/001--..004--*.md, one file per
  ticket, numbered blockers first (the prefactor as 001), each with a
  "Blocked by" line and status ready-for-agent. The skill sets
  disable-model-invocation, so run it through evaluate-skill's prepare
  step; run with --scaffold --allow-tools Bash Write.
tags: [publish, local-files]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, AskUserQuestion]
  prompt: |
    Use the to-tickets skill for the bulk price tiers feature. We already
    went through the breakdown together and I approved it as it stands:

    - "Show the applied tier on the cart page" (blocked by "Cart total
      uses price tiers")
    - "Cart total uses price tiers" (blocked by "Extract a PriceCalculator
      shared by the cart API and the cart page")
    - "Admins set price tiers through the product API" (blocked by "Cart
      total uses price tiers")
    - "Extract a PriceCalculator shared by the cart API and the cart page"
      (no blockers)

    No more questions: publish them.
graders:
  - name: four-ticket-files
    type: regex
    pattern: '\.agents/issues/00[1-4]--[^/\n]+\.md'
    match: "count:4"
    target: files
  - name: prefactor-first
    type: regex
    pattern: '\.agents/issues/001--[^\n]*(price-?calculator|extract)'
    flags: i
    target: files
  - name: blocked-by-in-each
    type: tool_used
    tool: Write
    input_match: 'issues/0[1-4]-[^"]*\.md.*Blocked by'
    min: 4
  - name: ready-for-agent-status
    type: tool_used
    tool: Write
    input_match: 'issues/0[1-4]-[^"]*\.md.*ready-for-agent'
    min: 4
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?to-tickets"'
    arm: with-only
