schema_version: "1.1"
name: call-tree-for-flow
description: >
  A runtime control-flow question about a small CLI. Targets the default
  failures of answering in paragraphs of prose (or a file-by-file tour)
  instead of a compact call tree that follows the real call order, of
  padding the answer with a preamble, and of reaching for an HTML file
  where a text view is enough. The skill sets disable-model-invocation, so
  prepare it with evaluate-skill before running. Run with --allow-tools
  Write, so the no-HTML grader is not passed by default.
tags: [call-tree]
context:
  add_dirs: [syncer]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Use the show-me skill. How does `syncer sync` get from the command line
    to the HTTP request? The code is in the `syncer` folder, one of your
    additional working directories.
graders:
  - name: call-order
    type: regex
    pattern: 'main[\s\S]*run_sync[\s\S]*sync[\s\S]*_fetch_with_retry[\s\S]*fetch_page'
  - name: in-code-block
    type: regex
    pattern: '```[a-z]*\n[^`]*run_sync[^`]*fetch_page[^`]*```'
  - name: no-html-file
    type: tool_used
    tool: Write
    input_match: '\.html'
    min: 0
    max: 0
    arm: both
  - name: brief
    type: llm
    criteria: >
      PASS if the answer opens with the view or one short sentence (no
      preamble such as "Great question" or "Let me explain"), and the prose
      outside code blocks is at most about five sentences. FAIL if it walks
      through the files in long paragraphs.
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
