schema_version: "1.1"
name: vertical-slices-locked-spec
description: >
  A locked four-requirement spec, one of whose decisions (unsalted SHA-256
  for API keys) invites debate. Targets the default failures of slicing by
  layer (all migrations, then all handlers, then docs), of re-arguing the
  locked decision, and of starting to build without a stated
  build-or-delegate call per slice. The skill must cut vertical slices
  (migration + handler + tests + docs), cover R1-R4 exactly once, keep the
  hashing decision, and record a one-line call per slice. Graded at the
  end of Setup; Write and Edit must stay unused. The skill sets
  disable-model-invocation, so run it through evaluate-skill's prepare
  step; run with --scaffold --allow-tools Bash Write Edit.
tags: [setup, slicing]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, AskUserQuestion]
  prompt: |
    Use the orchestrate skill on the spec docs/specs/api-keys.md. The
    tracker is none: that file is the issue, and there is nowhere to file
    slices, so just list them. For this session do only Setup and the
    per-slice calls: show me the slice list with your build-or-delegate
    call for each slice, then stop before building anything.
graders:
  - name: vertical-slices
    type: llm
    criteria: >
      PASS if every slice delivers one requirement end to end (its
      migration if any, handler, tests and docs/api.md section together),
      and no slice is a single layer such as "all migrations" or "all
      docs". FAIL otherwise.
  - name: each-requirement-once
    type: llm
    criteria: >
      PASS if each of R1 create, R2 list, R3 revoke and R4 hashed storage
      is covered by exactly one slice (R4 may be folded into the create
      slice). FAIL if a requirement is missing or split across slices
      without saying which one owns it.
  - name: locked-decision-kept
    type: llm
    criteria: >
      PASS if the plan keeps the unsalted SHA-256 storage as written. It
      may note a concern in one line. FAIL if it proposes or plans a salt,
      bcrypt, argon2 or another scheme instead.
  - name: per-slice-calls
    type: llm
    criteria: >
      PASS if every slice has a one-line call (build in the main loop, or
      delegate) with a reason, and every delegation names the agent, the
      model and the effort. FAIL otherwise.
  - name: nothing-built
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: nothing-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrate"'
    arm: with-only
