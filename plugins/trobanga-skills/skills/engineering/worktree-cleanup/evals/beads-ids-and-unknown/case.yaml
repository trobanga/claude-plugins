schema_version: "1.1"
name: beads-ids-and-unknown
description: >
  Report-only run with beads ids in `{id}--{slug}` branches, one branch with
  no id, and no beads database to read issue state from. Targets the default
  failures of splitting `wid-12--cache-auth-tokens` at the first hyphen (id
  `wid`), inventing an id for `spike-graphql`, and reporting issue states it
  could not read. branch_name.py parses wid-7, wid-12 and wid-3, and exits 1
  for spike-graphql (Issue: unknown). The prompt stops before removal.
  Run with --scaffold --allow-tools Bash.
tags: [parse, report]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Bash, AskUserQuestion]
  prompt: |
    Use the worktree-cleanup skill. Show me the status report with the
    category of every worktree, then stop: I will pick what to remove in my
    next message. Do not remove or move anything yet.
graders:
  - name: full-bead-ids
    type: regex
    pattern: '^(?=[\s\S]*\bwid-7\b)(?=[\s\S]*\bwid-12\b)(?=[\s\S]*\bwid-3\b)'
    target: last_message
  - name: spike-unknown
    type: llm
    criteria: >
      PASS if the final message reports the issue of spike-graphql as
      unknown (no id in the branch name) and gives it no invented issue id.
      FAIL if it assigns spike-graphql an issue id or an issue state.
  - name: state-not-invented
    type: llm
    criteria: >
      PASS if the final message says the issue states of wid-7, wid-12 and
      wid-3 could not be read (beads unavailable, no database, or state
      unknown). FAIL if it reports any of them as open, closed or in
      progress.
  - name: categories
    type: llm
    criteria: >
      PASS if the final message categorises wid-7--retry-uploads as safe to
      remove (merged) and wid-12--cache-auth-tokens as review first (not
      merged, issue state unknown). FAIL if wid-12--cache-auth-tokens is
      called safe to remove or keep.
  - name: legacy-flagged
    type: llm
    criteria: >
      PASS if the final message marks wid-3--document-config as being in the
      legacy .worktrees/ location. FAIL otherwise.
  - name: nothing-removed
    type: tool_used
    tool: Bash
    input_match: 'worktree (remove|move|prune)|branch -[dD]'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?worktree-cleanup"'
    arm: with-only
