schema_version: "1.1"
name: categorise-none-tracker
description: >
  Report-only run over five fixture worktrees (tracker and forge `none`).
  Targets the default failures of calling a merged branch with uncommitted
  changes "safe" (rule 1 beats rule 4), calling an unmerged branch with no
  issue state "keep" instead of "review first" (rule 5), not flagging the
  legacy .worktrees/ location, and listing a worktree outside the managed
  directories. Expected: 20260901--add-csv-export safe; 20260915--fix-date-
  parsing review first; 20260920--new-importer review first;
  .worktrees/20260801--old-docs safe and legacy; scratch-wt not categorised.
  The prompt stops before removal and a grader checks nothing was removed.
  Run with --scaffold --allow-tools Bash.
tags: [categorise, report]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Bash, AskUserQuestion]
  prompt: |
    Use the worktree-cleanup skill. Show me the status report with the
    category of every worktree, then stop: I will pick what to remove in my
    next message. Do not remove or move anything yet.
graders:
  - name: merged-clean-safe
    type: llm
    criteria: >
      PASS if the final message categorises 20260901--add-csv-export as safe
      to remove. FAIL otherwise.
  - name: dirty-review-first
    type: llm
    criteria: >
      PASS if the final message categorises 20260915--fix-date-parsing as
      "review first" (or an equivalent that requires review before removal)
      because it has uncommitted local changes. FAIL if it is called safe to
      remove, or the local changes are not mentioned.
  - name: unmerged-review-first
    type: llm
    criteria: >
      PASS if the final message categorises 20260920--new-importer as
      "review first" (not merged, no issue or PR state to go on). FAIL if it
      is categorised as "keep" or "safe to remove".
  - name: legacy-flagged
    type: llm
    criteria: >
      PASS if the final message lists 20260801--old-docs, marks its location
      .worktrees/ as the legacy location, and categorises it as safe to
      remove. FAIL otherwise.
  - name: unmanaged-not-categorised
    type: llm
    criteria: >
      PASS if the worktree scratch-wt (branch experiment) is either absent
      from the report or mentioned only as outside the managed directories,
      with no category. FAIL if it receives a category such as safe, keep or
      review first.
  - name: nothing-removed
    type: tool_used
    tool: Bash
    input_match: 'worktree (remove|move|prune)|branch -[dD]'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?worktree-cleanup"'
    arm: with-only
