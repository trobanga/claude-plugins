schema_version: "1.1"
name: lede-first-bug
description: >
  A rambling bug discussion with history, a side idea and one trap. Targets
  the default failures of opening with a Background or Context section,
  writing far past 150 words, carrying the side idea (Kafka) into the
  issue, putting code identifiers in the lede, and dropping the trap (the
  partner keys on the Berlin date in the file name). Read-only; needs no
  grants, and no tool can file anything.
tags: [structure, length]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Use the draft-issue skill. Draft an issue from what we just worked out:

    Some history first: in 2024 we moved the nightly jobs from cron to our
    own scheduler, and the loan export to our partner CityTools has run at
    02:00 Berlin time ever since. On the night the clocks went back
    (26 October) the export ran twice, because 02:00 happened twice, and
    CityTools got every loan record twice in their CSV. They had to
    de-duplicate by hand and complained. It will happen again next October.
    The job is defined in `jobs/export_loans.py` with the schedule
    `"0 2 * * *"` and `tz="Europe/Berlin"`. We agreed to run it at a fixed
    UTC time instead. Careful: CityTools' importer reads the date in the
    file name, and that date must stay the Berlin calendar date, even when
    the job runs before midnight UTC. Someone also suggested we could move
    all exports to Kafka one day, but that's a separate discussion.
graders:
  - name: headline-short
    type: regex
    pattern: '^# (?:\S+[ \t]+){0,9}\S+[ \t]*$'
    flags: m
  - name: details-section
    type: regex
    pattern: '^## Details'
    flags: m
  - name: done-when-checkboxes
    type: regex
    pattern: '^## Done when[\s\S]*^- \[ \] '
    flags: m
  - name: no-background-section
    type: regex
    pattern: '^#+ *(Background|Context|Motivation|History|Problem)'
    flags: mi
    match: not_contains
  - name: under-length
    type: regex
    pattern: '(?:\S+\s+){230}'
    match: not_contains
  - name: side-idea-dropped
    type: regex
    pattern: 'Kafka'
    match: not_contains
  - name: trap-kept
    type: regex
    pattern: '(file ?name|filename)'
    flags: i
  - name: plain-lede
    type: llm
    criteria: >
      PASS if the paragraph right after the headline has at most three
      sentences, says that the partner gets duplicate records when the
      clocks go back and why that matters, and contains no code
      identifiers, file paths, cron expressions or time-zone IDs. FAIL
      otherwise.
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
